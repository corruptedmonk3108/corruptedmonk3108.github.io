<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xhipment Tools</title>
  <script>
    (function() {
      var auth = null;
      try { auth = JSON.parse(localStorage.getItem('xhipAuth') || 'null'); } catch(e) {}
      if (!auth || !auth.expires || Date.now() > auth.expires) {
        localStorage.removeItem('xhipAuth');
        window.location.replace('/login.html');
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .card-hover { transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.09); }
    .fade-in { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="bg-white border-b border-gray-200 px-6 py-5">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-xl font-semibold text-gray-800">Xhipment Tools</h1>
        <p class="text-sm text-gray-500">Internal operations toolkit</p>
      </div>
      <div class="flex items-center gap-3">
        <span id="user-email" class="text-xs text-gray-500"></span>
        <button onclick="logout()" class="text-xs px-3 py-1.5 rounded-full border border-gray-200 text-gray-500 hover:text-red-600 hover:border-red-200 transition-colors">Logout</button>
      </div>
      <script>
        (function() {
          var auth = null;
          try { auth = JSON.parse(localStorage.getItem('xhipAuth') || 'null'); } catch(e) {}
          if (auth && auth.email) document.getElementById('user-email').textContent = auth.email;
        })();
        function logout() {
          localStorage.removeItem('xhipAuth');
          window.location.replace('/login.html');
        }
      </script>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10">

    <!-- Category selection -->
    <div id="view-categories" class="fade-in">
      <p class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-5">Select a category</p>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">

        <button onclick="showCategory('imports')"
          class="card-hover bg-white rounded-2xl border border-gray-200 p-6 text-left w-full">
          <div class="w-11 h-11 rounded-xl bg-purple-50 flex items-center justify-center mb-4">
            <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M21 10V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10"/><path d="M23 3H1v7h22V3z"/><path d="M10 21V3"/>
            </svg>
          </div>
          <h3 class="text-sm font-semibold text-gray-800 mb-1">Imports &amp; Customs</h3>
          <p class="text-xs text-gray-400">2 tools</p>
        </button>

        <button onclick="showCategory('drayage')"
          class="card-hover bg-white rounded-2xl border border-gray-200 p-6 text-left w-full">
          <div class="w-11 h-11 rounded-xl bg-blue-50 flex items-center justify-center mb-4">
            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="1" y="3" width="15" height="13" rx="1"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
            </svg>
          </div>
          <h3 class="text-sm font-semibold text-gray-800 mb-1">Drayage</h3>
          <p class="text-xs text-gray-400">1 tool</p>
        </button>

        <button onclick="showCategory('transloading')"
          class="card-hover bg-white rounded-2xl border border-gray-200 p-6 text-left w-full">
          <div class="w-11 h-11 rounded-xl bg-green-50 flex items-center justify-center mb-4">
            <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
          </div>
          <h3 class="text-sm font-semibold text-gray-800 mb-1">Transloading + LM</h3>
          <p class="text-xs text-gray-400">Coming soon</p>
        </button>

      </div>
    </div>

    <!-- Tool views (hidden by default) -->
    <div id="view-tools" class="hidden fade-in">
      <button onclick="showCategories()" class="flex items-center gap-1.5 text-sm text-gray-400 hover:text-gray-600 transition-colors mb-6">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Back to categories
      </button>
      <p id="cat-label" class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-5"></p>
      <div id="tool-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-5"></div>
    </div>

  </main>

  <script>
    const CATEGORIES = {
      imports: {
        label: 'Imports & Customs Tools',
        tools: [
          {
            href: './hs-scanner/',
            icon: `<svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`,
            iconBg: 'bg-purple-50',
            title: 'HS Code Scanner',
            desc: 'Scan commercial invoices to identify HS codes and check IEEPA/tariff compliance.',
          },
          {
            href: './refund-calculator/',
            icon: `<svg class="w-5 h-5 text-amber-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`,
            iconBg: 'bg-amber-50',
            title: 'Entry Summary Refund Calculator',
            desc: 'Determine IEEPA refund eligibility and calculate amounts from entry summary reports.',
          },
        ],
      },
      drayage: {
        label: 'Drayage Tools',
        tools: [
          {
            href: './appointment-planner/',
            icon: `<svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
            iconBg: 'bg-blue-50',
            title: 'Appointment Planner',
            desc: 'Calculate suggested delivery appointment dates for FCL/LCL shipments based on SLA logic.',
          },
        ],
      },
      transloading: {
        label: 'Transloading + LM Tools',
        tools: [],
      },
    };

    function showCategory(key) {
      const cat = CATEGORIES[key];
      document.getElementById('cat-label').textContent = cat.label;

      const grid = document.getElementById('tool-grid');
      if (cat.tools.length === 0) {
        grid.innerHTML = `<div class="bg-white rounded-2xl border border-dashed border-gray-200 p-6 flex items-center justify-center col-span-2">
          <p class="text-sm text-gray-400">Tools coming soon</p>
        </div>`;
      } else {
        grid.innerHTML = cat.tools.map(t => `
          <a href="${t.href}" class="card-hover bg-white rounded-2xl border border-gray-200 p-6 block no-underline">
            <div class="flex items-start gap-4">
              <div class="w-11 h-11 rounded-xl ${t.iconBg} flex items-center justify-center flex-shrink-0">${t.icon}</div>
              <div>
                <h3 class="text-base font-semibold text-gray-800 mb-1">${t.title}</h3>
                <p class="text-sm text-gray-500 leading-snug">${t.desc}</p>
              </div>
            </div>
          </a>`).join('');
      }

      document.getElementById('view-categories').classList.add('hidden');
      const toolView = document.getElementById('view-tools');
      toolView.classList.remove('hidden');
      toolView.classList.add('fade-in');
    }

    function showCategories() {
      document.getElementById('view-tools').classList.add('hidden');
      const catView = document.getElementById('view-categories');
      catView.classList.remove('hidden');
      catView.classList.add('fade-in');
    }
  </script>

  <footer class="text-center text-xs text-gray-400 pb-8">
    &copy; 2026 <a href="https://xhipment.com" class="hover:underline">Xhipment</a>
  </footer>

</body>
</html>
