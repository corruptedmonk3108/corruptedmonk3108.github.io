<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAPE Claims Status — Xhipment</title>
  <script>
    (function() {
      var auth = null;
      try { auth = JSON.parse(localStorage.getItem('xhipAuth') || 'null'); } catch(e) {}
      if (!auth || !auth.expires || Date.now() > auth.expires) {
        localStorage.removeItem('xhipAuth');
        window.location.replace('/login.html');
      }
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-6 py-4 sticky top-0 z-10">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/" class="text-gray-400 hover:text-gray-600 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </a>
        <div>
          <h1 class="text-lg font-semibold text-gray-800">CAPE Claims Status</h1>
          <p class="text-xs text-gray-400">IEEPA refund claims tracker</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span id="last-updated" class="text-xs text-gray-400 hidden"></span>
        <button id="refresh-btn"
          class="text-xs px-3 py-1.5 rounded-full border border-gray-200 text-gray-500 hover:text-teal-600 hover:border-teal-200 transition-colors">
          Refresh
        </button>
      </div>
    </div>
  </header>

  <!-- Stats bar -->
  <div class="bg-white border-b border-gray-100 px-6 py-5">
    <div class="max-w-7xl mx-auto grid grid-cols-2 sm:grid-cols-4 gap-6">
      <div>
        <p class="text-xs text-gray-400 mb-0.5">Total Entries</p>
        <p id="stat-total" class="text-2xl font-bold text-gray-800">—</p>
      </div>
      <div>
        <p class="text-xs text-gray-400 mb-0.5">Total Potential Refund</p>
        <p id="stat-refund" class="text-2xl font-bold text-gray-800">—</p>
      </div>
      <div>
        <p class="text-xs text-gray-400 mb-0.5">Entry Summary Updated</p>
        <p id="stat-updated" class="text-2xl font-bold text-green-600">—</p>
      </div>
      <div>
        <p class="text-xs text-gray-400 mb-0.5">Failed</p>
        <p id="stat-failed" class="text-2xl font-bold text-red-500">—</p>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
    <div class="relative w-full sm:w-80">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search" type="text" placeholder="Search by customer name…"
        class="w-full pl-9 pr-4 py-2 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-teal-200 focus:border-teal-400 transition" />
    </div>
    <button id="download-btn"
      class="flex items-center gap-2 text-sm px-4 py-2 rounded-lg border border-gray-200 text-gray-600 hover:text-teal-600 hover:border-teal-300 bg-white transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download CSV
    </button>
  </div>

  <!-- Table -->
  <div class="max-w-7xl mx-auto px-6 pb-10">
    <div id="loading" class="bg-white rounded-xl border border-gray-200 flex items-center justify-center h-48">
      <div class="flex items-center gap-2 text-sm text-gray-400">
        <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
        </svg>
        Loading claims data…
      </div>
    </div>
    <div id="error-banner" class="hidden bg-red-50 border border-red-200 rounded-xl px-5 py-4 text-sm text-red-600 mb-4"></div>
    <div id="table-wrap" class="hidden bg-white rounded-xl border border-gray-200 overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-gray-50 border-b border-gray-200 text-left">
            <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide whitespace-nowrap">#</th>
            <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide whitespace-nowrap">Entry Number</th>
            <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Customer Name</th>
            <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Status</th>
            <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide whitespace-nowrap">CAPE Filing Date</th>
            <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">3P IOR Provider</th>
            <th class="px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide text-right whitespace-nowrap">Potential Refund</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
      <div id="empty-state" class="hidden text-center py-12 text-sm text-gray-400">No entries match your search.</div>
    </div>
    <p id="row-count" class="text-xs text-gray-400 mt-2 text-right hidden"></p>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxtWn6NDA6PAJd6QO7rkKvseCJWXhJssJt6-3O-inUKBmLxEyoZGKE8MUcUYID5CtdQww/exec';
    const SECRET  = 'xhip-claims-2026';

    let allData  = [];
    let showData = [];

    const fmtUSD = v => {
      const n = parseFloat(String(v == null ? '' : v).replace(/[$,]/g, ''));
      return isNaN(n) ? '—' : '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    async function loadData() {
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('table-wrap').classList.add('hidden');
      document.getElementById('error-banner').classList.add('hidden');
      document.getElementById('row-count').classList.add('hidden');

      try {
        const res = await fetch(`${GAS_URL}?secret=${encodeURIComponent(SECRET)}&action=read`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'API error');
        allData = json.data || [];
        updateStats();
        render();
        const lu = document.getElementById('last-updated');
        lu.textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        lu.classList.remove('hidden');
      } catch (err) {
        const eb = document.getElementById('error-banner');
        eb.textContent = 'Failed to load data: ' + err.message;
        eb.classList.remove('hidden');
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function updateStats() {
      const total   = allData.length;
      const failed  = allData.filter(r => (r['STATUS'] || '').toLowerCase().trim() === 'failed').length;
      const updated = allData.filter(r => (r['STATUS'] || '').toLowerCase().trim() === 'entry summary updated').length;
      const refund  = allData.reduce((sum, r) => {
        const n = parseFloat(String(r['Potential Refund Amount'] == null ? '' : r['Potential Refund Amount']).replace(/[$,]/g, ''));
        return sum + (isNaN(n) ? 0 : n);
      }, 0);

      document.getElementById('stat-total').textContent   = total.toLocaleString();
      document.getElementById('stat-failed').textContent  = failed.toLocaleString();
      document.getElementById('stat-updated').textContent = updated.toLocaleString();
      document.getElementById('stat-refund').textContent  = '$' + refund.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function getFiltered() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      return allData
        .filter(r => (r['STATUS'] || '').toLowerCase().trim() !== 'failed')
        .filter(r => !q || (r['Customer Name'] || '').toLowerCase().includes(q));
    }

    function render() {
      showData = getFiltered();
      const tbody = document.getElementById('table-body');
      const empty = document.getElementById('empty-state');
      const wrap  = document.getElementById('table-wrap');
      const count = document.getElementById('row-count');

      wrap.classList.remove('hidden');

      if (!showData.length) {
        tbody.innerHTML = '';
        empty.classList.remove('hidden');
        count.classList.add('hidden');
      } else {
        empty.classList.add('hidden');
        tbody.innerHTML = showData.map((r, i) => `
          <tr class="border-b border-gray-100 hover:bg-gray-50 transition-colors">
            <td class="px-4 py-3 text-xs text-gray-400">${i + 1}</td>
            <td class="px-4 py-3 font-mono text-xs text-gray-500 whitespace-nowrap">${esc(r['ENTRY_NUMBER'])}</td>
            <td class="px-4 py-3 text-gray-800">${esc(r['Customer Name'])}</td>
            <td class="px-4 py-3">
              <span class="px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Entry Summary Updated</span>
            </td>
            <td class="px-4 py-3 text-gray-600 whitespace-nowrap">${esc(r['CAPE Declaration Filing Date']) || '—'}</td>
            <td class="px-4 py-3 text-gray-600">${esc(r['3P IOR Provider']) || '—'}</td>
            <td class="px-4 py-3 text-right font-medium text-gray-800 whitespace-nowrap">${fmtUSD(r['Potential Refund Amount'])}</td>
          </tr>
        `).join('');
        count.textContent = showData.length.toLocaleString() + ' entries shown';
        count.classList.remove('hidden');
      }
    }

    function downloadCSV() {
      if (!showData.length) return;
      const cols = [
        { key: 'ENTRY_NUMBER',                 label: 'Entry Number'                 },
        { key: 'Customer Name',                label: 'Customer Name'                },
        { key: 'STATUS',                       label: 'Status'                       },
        { key: 'CAPE Declaration Filing Date', label: 'CAPE Declaration Filing Date' },
        { key: '3P IOR Provider',              label: '3P IOR Provider'              },
        { key: 'Potential Refund Amount',      label: 'Potential Refund Amount'      },
      ];
      const escape = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const lines  = [cols.map(c => escape(c.label)).join(',')];
      showData.forEach(r => lines.push(cols.map(c => escape(r[c.key])).join(',')));
      const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
      const url  = URL.createObjectURL(blob);
      const a    = Object.assign(document.createElement('a'), { href: url, download: 'cape_claims_status.csv' });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    document.getElementById('search').addEventListener('input', render);
    document.getElementById('download-btn').addEventListener('click', downloadCSV);
    document.getElementById('refresh-btn').addEventListener('click', loadData);

    loadData();
  </script>

</body>
</html>
