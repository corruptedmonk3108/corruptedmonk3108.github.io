<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTD Calculator</title>
  <script>
    (function() {
      var auth = null;
      try { auth = JSON.parse(localStorage.getItem('xhipAuth') || 'null'); } catch(e) {}
      if (!auth || !auth.expires || Date.now() > auth.expires) {
        localStorage.removeItem('xhipAuth');
        window.location.replace('/login.html');
        return;
      }
      document.addEventListener('DOMContentLoaded', function() {
        var bar = document.createElement('div');
        bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#1e293b;color:#94a3b8;font-family:system-ui,sans-serif;font-size:12px;padding:5px 16px;display:flex;align-items:center;justify-content:space-between;';
        bar.innerHTML = '<a href="/" style="color:#e2e8f0;text-decoration:none;font-weight:500;">← Xhipment Tools</a>' +
          '<span style="display:flex;align-items:center;gap:14px;">' +
          '<span>' + (auth.email || '') + '</span>' +
          '<a href="#" onclick="localStorage.removeItem(\'xhipAuth\');window.location.replace(\'/login.html\');return false;" style="color:#f87171;text-decoration:none;">Logout</a>' +
          '</span>';
        document.body.insertBefore(bar, document.body.firstChild);
        document.body.style.paddingTop = '30px';
      });
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    .drop-active { border-color: #6366f1; background-color: #eef2ff; }
    .table-wrap { max-height: 480px; overflow: auto; }
    table { border-collapse: collapse; font-size: 12px; }
    th { position: sticky; top: 0; background: #1e293b; color: #f1f5f9; padding: 6px 10px; white-space: nowrap; z-index: 1; }
    td { padding: 4px 10px; border-bottom: 1px solid #e2e8f0; white-space: nowrap; }
    tr:hover td { background: #f8fafc; }
    .badge-true  { background: #dcfce7; color: #166534; }
    .badge-false { background: #fee2e2; color: #991b1b; }
    .badge { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; font-weight:600; }
    .col-new { background: #fefce8; }
    .col-edited { background: #fff7ed; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800">

  <div class="max-w-screen-xl mx-auto px-4 py-10">

    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-slate-900">OTD Calculator</h1>
      <p class="text-slate-500 mt-1 text-sm">Upload your source data Excel file to apply OTD adjustments and download the cleaned output.</p>
    </div>

    <!-- Upload zone -->
    <div id="dropzone"
         class="border-2 border-dashed border-slate-300 rounded-xl bg-white p-10 text-center cursor-pointer transition-all hover:border-indigo-400 hover:bg-indigo-50"
         onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" class="hidden" />
      <div class="text-4xl mb-3">📂</div>
      <p class="font-medium text-slate-700">Click to upload or drag & drop</p>
      <p class="text-slate-400 text-sm mt-1">Supports .xlsx, .xls, .csv</p>
    </div>

    <!-- Status -->
    <div id="status" class="hidden mt-4 text-sm font-medium"></div>

    <!-- Stats bar -->
    <div id="stats" class="hidden mt-6 grid grid-cols-2 sm:grid-cols-4 gap-4"></div>

    <!-- Action buttons -->
    <div id="actions" class="hidden mt-4 flex gap-3 flex-wrap">
      <button onclick="downloadResult()"
              class="px-5 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition">
        ⬇ Download Processed File
      </button>
      <button onclick="resetTool()"
              class="px-5 py-2 bg-slate-200 text-slate-700 rounded-lg font-medium hover:bg-slate-300 transition">
        Upload Another File
      </button>
    </div>

    <!-- Month-wise trade lane OTD table -->
    <div id="monthSection" class="hidden mt-6 bg-white rounded-xl shadow-sm overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
        <div>
          <span class="font-semibold text-slate-700">OTD% by Trade Lane & Month</span>
          <span class="text-slate-400 font-normal text-sm ml-2">three adjustment scenarios compared</span>
        </div>
        <button onclick="downloadMonthLaneTable()"
                class="px-4 py-1.5 bg-indigo-600 text-white text-sm rounded-lg font-medium hover:bg-indigo-700 transition">
          ⬇ Download
        </button>
      </div>
      <div class="table-wrap">
        <table id="monthLaneTable" class="w-full"></table>
      </div>
    </div>

    <!-- Preview table -->
    <div id="preview" class="hidden mt-6 bg-white rounded-xl shadow-sm overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
        <span class="font-semibold text-slate-700">Preview
          <span class="text-slate-400 font-normal text-sm ml-2">(first 50 rows)</span>
        </span>
        <div class="flex gap-3 text-xs text-slate-500">
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-yellow-100 border border-yellow-200 inline-block"></span> New column</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-orange-100 border border-orange-200 inline-block"></span> Edited column</span>
        </div>
      </div>
      <div class="table-wrap">
        <table id="previewTable"></table>
      </div>
    </div>

  </div>

  <script>
    // ── globals ──────────────────────────────────────────────────────────────
    let processedData = null;
    let processedHeaders = [];
    let monthLaneDataGlobal = [];

    // ── drag & drop wiring ───────────────────────────────────────────────────
    const dz = document.getElementById('dropzone');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drop-active'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drop-active'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('drop-active');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });
    document.getElementById('fileInput').addEventListener('change', e => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    // ── main processing pipeline ─────────────────────────────────────────────
    function handleFile(file) {
      setStatus('Reading file…', 'text-indigo-600');
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
          const ws = wb.Sheets[wb.SheetNames[0]];
          // Read as raw array-of-arrays (keep everything including blanks)
          let raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
          const result = process(raw);
          processedData   = result.rows;
          processedHeaders = result.headers;
          monthLaneDataGlobal = result.monthLaneData;
          renderStats(result.stats);
          renderMonthLaneTable(result.monthLaneData);
          renderPreview(result.headers, result.rows);
          document.getElementById('actions').classList.remove('hidden');
          document.getElementById('preview').classList.remove('hidden');
          document.getElementById('stats').classList.remove('hidden');
          document.getElementById('monthSection').classList.remove('hidden');
          setStatus(`✓ Processed ${result.rows.length} rows from "${file.name}"`, 'text-green-600');
        } catch (err) {
          setStatus('Error: ' + err.message, 'text-red-600');
          console.error(err);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function process(raw) {
      // (b) Delete first two rows
      raw = raw.slice(2);

      // Row 0 is now the header row
      const headers = raw[0].map(h => String(h).trim());
      const dataRows = raw.slice(1);

      // Column indices
      const idx = name => {
        const i = headers.indexOf(name);
        if (i === -1) throw new Error(`Column "${name}" not found. Found: ${headers.join(', ')}`);
        return i;
      };

      const I_TOTAL_ACTUAL  = idx('total_actual_days');
      const I_TOTAL_SLA     = idx('total_sla_days');
      const I_LEG1_ACTUAL   = idx('leg1_actual');
      const I_TRADE_LANE    = idx('trade_lane');
      const I_DELIVERY_DATE = idx('delivery_date');

      let stats = { totalRows: 0, delayed: 0, adjusted: 0, onTime: 0 };

      // Process each data row
      const rows = dataRows
        .filter(row => row.some(c => c !== ''))  // skip fully empty rows
        .map(row => {
          const r = [...row];
          stats.totalRows++;

          let totalActual    = parseFloat(r[I_TOTAL_ACTUAL]);
          const totalSLA     = parseFloat(r[I_TOTAL_SLA]);
          let leg1Actual     = parseFloat(r[I_LEG1_ACTUAL]);
          const origActual   = totalActual;  // save before any adjustment

          // (c) difference = total_actual_days - total_sla_days
          const diff = isNaN(origActual) || isNaN(totalSLA) ? null : origActual - totalSLA;

          // Original overall_delay before any scenario adjustment
          const originalOverallDelay = diff === null ? null : origActual > totalSLA;

          // Compute per-scenario delays from original values
          const scenarioDelay = (threshold) => {
            if (diff === null) return null;
            const applies = threshold === 1 ? diff === 1 : (diff > 0 && diff <= threshold);
            const adj = applies ? origActual - diff : origActual;
            return adj > totalSLA;
          };
          const s1_delay = scenarioDelay(3);
          const s2_delay = scenarioDelay(2);
          const s3_delay = scenarioDelay(1);

          // (e) Apply scenario-2 adjustment to row values for download
          let adjusted = false;
          if (diff !== null && diff > 0 && diff <= 2) {
            leg1Actual  -= diff;
            totalActual -= diff;
            r[I_LEG1_ACTUAL]  = leg1Actual;
            r[I_TOTAL_ACTUAL] = totalActual;
            adjusted = true;
            stats.adjusted++;
          }

          if (s2_delay === true)  stats.delayed++;
          else if (s2_delay === false) stats.onTime++;

          // Parse delivery month for month-wise breakdown
          let deliveryMonth = 'Unknown';
          let monthSortKey  = 'zzzz';
          const dateStr = String(r[I_DELIVERY_DATE] || '').trim();
          if (dateStr) {
            const d = new Date(dateStr);
            if (!isNaN(d)) {
              deliveryMonth = d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
              monthSortKey  = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            }
          }

          return {
            values:               r,
            difference:           diff,
            overallDelay:         s2_delay,
            originalOverallDelay: originalOverallDelay,
            adjusted:             adjusted,
            s1_delay, s2_delay, s3_delay,
            deliveryMonth, monthSortKey,
          };
        });

      // Month-wise trade lane aggregation (old + 3 scenarios)
      const monthLaneMap = {};
      rows.forEach(row => {
        const lane = String(row.values[I_TRADE_LANE] || 'Unknown').trim();
        const key  = `${lane}||${row.monthSortKey}`;
        if (!monthLaneMap[key]) {
          monthLaneMap[key] = {
            lane, month: row.deliveryMonth, sortKey: row.monthSortKey,
            total: 0, oldOnTime: 0, s1OnTime: 0, s2OnTime: 0, s3OnTime: 0,
          };
        }
        monthLaneMap[key].total++;
        if (row.originalOverallDelay === false) monthLaneMap[key].oldOnTime++;
        if (row.s1_delay === false)             monthLaneMap[key].s1OnTime++;
        if (row.s2_delay === false)             monthLaneMap[key].s2OnTime++;
        if (row.s3_delay === false)             monthLaneMap[key].s3OnTime++;
      });

      const monthLaneData = Object.values(monthLaneMap)
        .sort((a, b) => a.lane.localeCompare(b.lane) || a.sortKey.localeCompare(b.sortKey));

      return { headers, rows, stats, monthLaneData };
    }

    // ── rendering ────────────────────────────────────────────────────────────
    function renderStats(s) {
      const container = document.getElementById('stats');
      const cards = [
        { label: 'Total Rows',     value: s.totalRows,  color: 'text-slate-700' },
        { label: 'Delayed',        value: s.delayed,    color: 'text-red-600'   },
        { label: 'On Time',        value: s.onTime,     color: 'text-green-600' },
        { label: 'Rows Adjusted',  value: s.adjusted,   color: 'text-orange-600'},
      ];
      container.innerHTML = cards.map(c => `
        <div class="bg-white rounded-xl p-4 shadow-sm">
          <div class="text-xs text-slate-400 uppercase tracking-wide">${c.label}</div>
          <div class="text-2xl font-bold mt-1 ${c.color}">${c.value}</div>
        </div>
      `).join('');
    }

    function renderMonthLaneTable(data) {
      const table = document.getElementById('monthLaneTable');
      const pctColor = p => p >= 75 ? '#16a34a' : p >= 50 ? '#f97316' : '#dc2626';
      const fmt  = (n, t) => t > 0 ? (100 * n / t).toFixed(1) + '%' : '—';
      const fmtn = (n, t) => t > 0 ? 100 * n / t : 0;

      let html = `<thead><tr>
        <th>Trade Lane</th>
        <th>Month</th>
        <th>Shipments</th>
        <th>Old OTD%</th>
        <th>OTD% (diff ≤ 3)</th>
        <th>OTD% (diff ≤ 2)</th>
        <th>OTD% (diff = 1)</th>
      </tr></thead><tbody>`;

      // Group by lane (data is already sorted lane → month)
      const laneGroups = {};
      data.forEach(r => {
        if (!laneGroups[r.lane]) laneGroups[r.lane] = [];
        laneGroups[r.lane].push(r);
      });

      Object.entries(laneGroups).forEach(([lane, months]) => {
        // Lane-level totals
        const tot = months.reduce((a, r) => ({
          total:    a.total    + r.total,
          oldOnTime: a.oldOnTime + r.oldOnTime,
          s1OnTime: a.s1OnTime + r.s1OnTime,
          s2OnTime: a.s2OnTime + r.s2OnTime,
          s3OnTime: a.s3OnTime + r.s3OnTime,
        }), { total: 0, oldOnTime: 0, s1OnTime: 0, s2OnTime: 0, s3OnTime: 0 });

        // Summary row
        html += `<tr style="background:#f1f5f9;border-top:2px solid #94a3b8;">
          <td class="font-bold" style="color:#1e293b">${lane}</td>
          <td class="font-semibold text-slate-500">Total</td>
          <td class="text-center font-bold">${tot.total}</td>
          <td class="text-center font-bold" style="color:${pctColor(fmtn(tot.oldOnTime, tot.total))}">${fmt(tot.oldOnTime, tot.total)}</td>
          <td class="text-center font-bold" style="color:${pctColor(fmtn(tot.s1OnTime,  tot.total))}">${fmt(tot.s1OnTime,  tot.total)}</td>
          <td class="text-center font-bold" style="color:${pctColor(fmtn(tot.s2OnTime,  tot.total))}">${fmt(tot.s2OnTime,  tot.total)}</td>
          <td class="text-center font-bold" style="color:${pctColor(fmtn(tot.s3OnTime,  tot.total))}">${fmt(tot.s3OnTime,  tot.total)}</td>
        </tr>`;

        // Month rows
        months.forEach(r => {
          html += `<tr>
            <td></td>
            <td class="text-slate-500">${r.month}</td>
            <td class="text-center">${r.total}</td>
            <td class="text-center font-bold" style="color:${pctColor(fmtn(r.oldOnTime, r.total))}">${fmt(r.oldOnTime, r.total)}</td>
            <td class="text-center font-bold" style="color:${pctColor(fmtn(r.s1OnTime,  r.total))}">${fmt(r.s1OnTime,  r.total)}</td>
            <td class="text-center font-bold" style="color:${pctColor(fmtn(r.s2OnTime,  r.total))}">${fmt(r.s2OnTime,  r.total)}</td>
            <td class="text-center font-bold" style="color:${pctColor(fmtn(r.s3OnTime,  r.total))}">${fmt(r.s3OnTime,  r.total)}</td>
          </tr>`;
        });
      });

      html += '</tbody>';
      table.innerHTML = html;
    }

    function renderPreview(headers, rows) {
      const table = document.getElementById('previewTable');
      const allHeaders = [...headers, 'difference', 'overall_delay'];
      const newCols    = new Set(['difference', 'overall_delay']);
      // Index of leg1_actual and total_actual_days — these are "edited" cols
      const editedIdx  = new Set([headers.indexOf('leg1_actual'), headers.indexOf('total_actual_days')]);

      let html = '<thead><tr>';
      allHeaders.forEach(h => { html += `<th>${h}</th>`; });
      html += '</tr></thead><tbody>';

      const preview = rows.slice(0, 50);
      preview.forEach(row => {
        html += '<tr>';
        row.values.forEach((cell, i) => {
          const isEdited = editedIdx.has(i) && row.adjusted;
          const cls = isEdited ? 'col-edited' : '';
          html += `<td class="${cls}">${cell === null || cell === undefined ? '' : cell}</td>`;
        });
        // difference column
        const diffVal = row.difference === null ? '' : row.difference;
        html += `<td class="col-new">${diffVal}</td>`;
        // overall_delay column
        if (row.overallDelay === null) {
          html += `<td class="col-new"></td>`;
        } else {
          const cls  = row.overallDelay ? 'badge-true' : 'badge-false';
          const text = row.overallDelay ? 'TRUE' : 'FALSE';
          html += `<td class="col-new"><span class="badge ${cls}">${text}</span></td>`;
        }
        html += '</tr>';
      });

      html += '</tbody>';
      table.innerHTML = html;
    }

    // ── download ─────────────────────────────────────────────────────────────
    function downloadMonthLaneTable() {
      const fmt = (n, t) => t > 0 ? parseFloat((100 * n / t).toFixed(1)) : '';
      const headers = ['Trade Lane', 'Month', 'Shipments', 'Old OTD%', 'OTD% (diff ≤ 3)', 'OTD% (diff ≤ 2)', 'OTD% (diff = 1)'];
      const rows = [headers];

      // Group by lane
      const laneGroups = {};
      monthLaneDataGlobal.forEach(r => {
        if (!laneGroups[r.lane]) laneGroups[r.lane] = [];
        laneGroups[r.lane].push(r);
      });

      Object.entries(laneGroups).forEach(([lane, months]) => {
        const tot = months.reduce((a, r) => ({
          total: a.total + r.total, oldOnTime: a.oldOnTime + r.oldOnTime,
          s1OnTime: a.s1OnTime + r.s1OnTime, s2OnTime: a.s2OnTime + r.s2OnTime, s3OnTime: a.s3OnTime + r.s3OnTime,
        }), { total: 0, oldOnTime: 0, s1OnTime: 0, s2OnTime: 0, s3OnTime: 0 });

        // Total row
        rows.push([lane, 'Total', tot.total,
          fmt(tot.oldOnTime, tot.total), fmt(tot.s1OnTime, tot.total),
          fmt(tot.s2OnTime, tot.total), fmt(tot.s3OnTime, tot.total)]);

        // Month rows
        months.forEach(r => {
          rows.push(['', r.month, r.total,
            fmt(r.oldOnTime, r.total), fmt(r.s1OnTime, r.total),
            fmt(r.s2OnTime, r.total), fmt(r.s3OnTime, r.total)]);
        });
      });

      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = headers.map((h, i) => ({
        wch: Math.max(h.length, ...rows.slice(1).map(r => String(r[i] ?? '').length)) + 2
      }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'OTD by Lane & Month');
      XLSX.writeFile(wb, 'OTD_by_Lane_Month.xlsx');
    }

    function downloadResult() {
      const allHeaders = [...processedHeaders, 'difference', 'overall_delay'];
      const sheetData  = [allHeaders];

      processedData.forEach(row => {
        const line = [...row.values];
        line.push(row.difference === null ? '' : row.difference);
        line.push(row.overallDelay === null ? '' : (row.overallDelay ? 'TRUE' : 'FALSE'));
        sheetData.push(line);
      });

      const ws = XLSX.utils.aoa_to_sheet(sheetData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Processed');

      // Auto column widths
      const colWidths = allHeaders.map((h, i) => {
        const maxLen = Math.max(
          h.length,
          ...sheetData.slice(1).map(r => String(r[i] ?? '').length)
        );
        return { wch: Math.min(maxLen + 2, 40) };
      });
      ws['!cols'] = colWidths;

      XLSX.writeFile(wb, 'OTD_Processed.xlsx');
    }

    // ── helpers ───────────────────────────────────────────────────────────────
    function setStatus(msg, cls) {
      const el = document.getElementById('status');
      el.className = 'mt-4 text-sm font-medium ' + cls;
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function resetTool() {
      processedData = null;
      processedHeaders = [];
      document.getElementById('fileInput').value = '';
      document.getElementById('status').classList.add('hidden');
      document.getElementById('stats').classList.add('hidden');
      document.getElementById('actions').classList.add('hidden');
      document.getElementById('preview').classList.add('hidden');
      document.getElementById('monthSection').classList.add('hidden');
      document.getElementById('previewTable').innerHTML = '';
      document.getElementById('monthLaneTable').innerHTML = '';
    }
  </script>
</body>
</html>
